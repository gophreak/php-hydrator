name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: [ '8.4' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          coverage: xdebug

      - name: Validate composer.json
        run: composer validate --no-check-publish || true

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: PHP CS Fixer (dry-run)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --allow-risky=yes

      - name: PHPStan (level 8)
        run: vendor/bin/phpstan analyse --memory-limit=1G --level=8

      - name: Run PHPUnit with coverage
        run: vendor/bin/phpunit --configuration phpunit.xml --coverage-clover=clover.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: clover-xml
          path: clover.xml